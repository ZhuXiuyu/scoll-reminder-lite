<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroll Reminder</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    .header {
      background: #ff6b6b;
      color: white;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-icon {
      font-size: 24px;
    }

    .header-title {
      font-size: 16px;
      font-weight: 600;
    }

    .section {
      background: white;
      margin: 8px;
      border-radius: 8px;
      padding: 12px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: #666;
      text-transform: uppercase;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    /* 开关 */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .toggle-label {
      font-size: 14px;
      font-weight: 500;
    }

    .toggle-switch {
      position: relative;
      width: 44px;
      height: 24px;
      background: #ccc;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .toggle-switch.active {
      background: #ff6b6b;
    }

    .toggle-switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      transition: transform 0.3s;
    }

    .toggle-switch.active::after {
      transform: translateX(20px);
    }

    /* 网站列表 */
    .website-list {
      max-height: 150px;
      overflow-y: auto;
    }

    .website-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .website-item:last-child {
      border-bottom: none;
    }

    .website-domain {
      font-size: 13px;
      color: #333;
    }

    .website-checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .add-website {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .add-website input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
    }

    .add-website button {
      padding: 8px 16px;
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }

    .add-website button:hover {
      background: #ff5252;
    }

    /* 模式选择 */
    .mode-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      cursor: pointer;
    }

    .mode-option input {
      cursor: pointer;
    }

    .mode-option label {
      font-size: 13px;
      cursor: pointer;
    }

    /* 统计 */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .stat-item {
      text-align: center;
      padding: 8px;
      background: #f9f9f9;
      border-radius: 6px;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 600;
      color: #ff6b6b;
    }

    .stat-label {
      font-size: 11px;
      color: #666;
      margin-top: 4px;
    }

    /* 底部链接 */
    .footer {
      padding: 12px;
      text-align: center;
    }

    .footer a {
      color: #ff6b6b;
      text-decoration: none;
      font-size: 13px;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 20px;
      color: #999;
      font-size: 13px;
    }

    /* 滚动条样式 */
    .website-list::-webkit-scrollbar {
      width: 4px;
    }

    .website-list::-webkit-scrollbar-track {
      background: #f1f1f1;
    }

    .website-list::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-icon">🛑</span>
    <span class="header-title">Scroll Reminder</span>
  </div>

  <div class="section">
    <div class="toggle-row">
      <span class="toggle-label">插件已启用</span>
      <div class="toggle-switch active" id="enabledToggle"></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">监测网站</div>
    <div class="website-list" id="websiteList">
      <!-- 动态生成 -->
    </div>
    <div class="add-website">
      <input type="text" id="newDomain" placeholder="输入域名，如: example.com">
      <button id="addBtn">添加</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">模式</div>
    <div class="mode-option">
      <input type="radio" name="mode" id="modeBlacklist" value="blacklist" checked>
      <label for="modeBlacklist">黑名单模式（只监测列表中的网站）</label>
    </div>
    <div class="mode-option">
      <input type="radio" name="mode" id="modeWhitelist" value="whitelist">
      <label for="modeWhitelist">白名单模式（监测所有网站，除了白名单）</label>
    </div>
  </div>

  <div class="section">
    <div class="section-title">今日统计</div>
    <div class="stats-grid">
      <div class="stat-item">
        <div class="stat-value" id="statTriggers">0</div>
        <div class="stat-label">触发提醒</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="statLeave">0</div>
        <div class="stat-label">选择离开</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="statContinue">0</div>
        <div class="stat-label">选择继续</div>
      </div>
    </div>
  </div>

  <div class="footer">
    <a href="#" id="openOptions">打开详细设置</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
