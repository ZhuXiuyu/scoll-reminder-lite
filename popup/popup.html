<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroll Reminder Lite</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #ffffff;
      color: #333;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #eee;
    }

    .header-icon {
      font-size: 24px;
    }

    .header-title {
      font-size: 16px;
      font-weight: 600;
    }

    .toggle-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding: 12px;
      background: #f5f5f5;
      border-radius: 8px;
    }

    .toggle-label {
      font-size: 14px;
      font-weight: 500;
    }

    .toggle-switch {
      position: relative;
      width: 44px;
      height: 24px;
      background: #ccc;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .toggle-switch.active {
      background: #ff6b6b;
    }

    .toggle-switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      transition: transform 0.3s;
    }

    .toggle-switch.active::after {
      transform: translateX(20px);
    }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: #666;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .site-list {
      margin-bottom: 16px;
    }

    .site-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .site-item:last-child {
      border-bottom: none;
    }

    .site-info {
      display: flex;
      flex-direction: column;
    }

    .site-name {
      font-size: 13px;
      font-weight: 500;
    }

    .site-domain {
      font-size: 11px;
      color: #999;
    }

    .site-checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .site-list.disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    .custom-section.disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    .disabled-notice {
      display: none;
      padding: 12px;
      background: #f5f5f5;
      border-radius: 8px;
      font-size: 13px;
      color: #999;
      text-align: center;
      margin-top: 12px;
    }

    .disabled-notice.show {
      display: block;
    }

    .custom-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #eee;
    }

    .add-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .add-input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
    }

    .add-btn {
      padding: 8px 16px;
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }

    .add-btn:hover {
      background: #ff5252;
    }

    .custom-list {
      max-height: 120px;
      overflow-y: auto;
    }

    .custom-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 13px;
    }

    .custom-domain {
      color: #666;
    }

    .delete-btn {
      padding: 4px 8px;
      background: #f0f0f0;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      color: #666;
    }

    .delete-btn:hover {
      background: #e0e0e0;
      color: #ff4444;
    }

    .hint {
      margin-top: 12px;
      padding: 8px;
      background: #fff8e1;
      border-radius: 6px;
      font-size: 11px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-title">Scroll Reminder Lite</span>
  </div>

  <div class="toggle-section">
    <span class="toggle-label">插件已启用</span>
    <div class="toggle-switch active" id="enabledToggle"></div>
  </div>

  <div class="section-title">默认监控站点</div>
  <div class="site-list" id="defaultSites">
    <!-- 动态生成 -->
  </div>

  <div class="disabled-notice" id="disabledNotice">
    插件已禁用，开启后可配置站点
  </div>

  <div class="custom-section" id="customSection">
    <div class="section-title">自定义高危网站 (全局监控)</div>
    <div class="add-row">
      <input type="text" class="add-input" id="customInput" placeholder="输入域名(如v2ex.com)">
      <button class="add-btn" id="addBtn">添加</button>
    </div>
    <div class="custom-list" id="customList">
      <!-- 动态生成 -->
    </div>
  </div>

  <div class="hint">
    * 修改后立即生效
  </div>

  <script src="popup.js"></script>
</body>
</html>
